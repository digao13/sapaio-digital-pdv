name: Build and Release Sapaio Digital

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore and Test
        run: dotnet test SapaioDigital.sln --configuration Release

      - name: Publish Self-Contained Win-x64
        run: >
          dotnet publish SapaioDigital.App/SapaioDigital.App.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=false
          -o publish_out

      - name: Package ZIP
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          Compress-Archive -Path "publish_out/*" -DestinationPath "SapaioDigital-$tag-win-x64.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: SapaioDigital-${{ github.ref_name }}-win-x64.zip
          generate_release_notes: true
