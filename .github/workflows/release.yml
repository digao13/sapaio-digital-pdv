name: Build, Installer and Release Sapaio Digital

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore and Test
        run: dotnet test SapaioDigital.slnx --configuration Release

      - name: Publish Self-Contained Win-x64
        run: >
          dotnet publish SapaioDigital.App/SapaioDigital.App.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=false
          -o publish_out

      - name: Package Portable ZIP
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          Compress-Archive -Path "publish_out/*" -DestinationPath "SapaioDigital-$tag-win-x64.zip"

      - name: Download VC++ Redistributable x64 for Installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "installer/redist" | Out-Null
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile "installer/redist/vc_redist.x64.exe"

      - name: Install Inno Setup and Build Windows Installer
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v', 'V')
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DAppVersion=$ver" "installer\SapaioDigital.iss"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            SapaioDigital-${{ github.ref_name }}-win-x64.zip
            installer/output/SapaioDigital-Setup-${{ github.ref_name }}.exe
          generate_release_notes: true
